<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tape Loss">
<meta name="theme-color" content="#151516">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Tape Loss</title>
<meta name="description" content="A lo-fi tape effect in your browser: wow, flutter, loss, grains and reverb. Play a file, record a loop, or run a live input through it.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tape Loss">
<meta property="og:title" content="Tape Loss">
<meta property="og:description" content="A lo-fi tape effect in your browser: wow, flutter, loss, grains and reverb. Play a file, record a loop, or run a live input through it.">
<meta property="og:url" content="https://thegoose12.github.io/tape-loss/">
<meta property="og:image" content="https://thegoose12.github.io/tape-loss/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tape Loss: two tape reels on a brushed metal deck">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css?v=44">
</head>
<body>
<main class="app" id="app">

  <!-- top bar: what goes in, transport, the sound, and the display switch -->
  <header class="bar">
    <div class="brand" id="brand" role="button" tabindex="0" aria-label="Tape Loss: technical data" data-help="The badge opens the technical data: what each part of the effect is doing, in numbers.">
      <h1>Tape Loss</h1>
      <p>warble mk IV</p>
    </div>
    <div class="seg src" id="src" role="radiogroup" aria-label="Source">
      <button type="button" role="radio" data-src="live" aria-checked="false" data-help="Live: whatever is plugged in passes straight through the effect.">Live</button>
      <button type="button" role="radio" data-src="loop" aria-checked="false" data-help="Loop: record a stretch of the input with Rec. It loops, and you play the effect over it.">Loop</button>
      <button type="button" role="radio" data-src="file" aria-checked="true" data-help="File: an audio file, looping. It starts with a built-in demo loop.">File</button>
    </div>
    <div class="transport" aria-label="Transport">
      <button type="button" class="tkey wide" id="play" aria-pressed="false" aria-label="Play" data-help="Start or stop the sound.">
        <span class="face"><span class="ico ico-play"></span></span>
      </button>
      <button type="button" class="tkey" id="rec" aria-pressed="false" aria-label="Record" data-help="Record the input into the loop, up to 30 seconds. Press again to stop; it starts looping at once.">
        <span class="face"><span class="ico ico-rec"></span></span>
      </button>
      <button type="button" class="tkey" id="bypass" aria-pressed="false" aria-label="Bypass" data-help="Bypass: hear the sound with the effect out of the way.">
        <span class="face"><svg class="ico ico-bypass" viewBox="0 0 34 20" width="34" height="20" aria-hidden="true">
          <rect class="fx" x="11" y="10.5" width="12" height="8.5" rx="2.5"/><path class="hop" d="M4 15.5C4 0 30 0 30 15.5"/>
        </svg></span>
      </button>
    </div>
    <div class="browser" aria-label="Sound">
      <button type="button" class="key-btn nav" id="preset-prev" aria-label="Previous preset" data-help="Previous preset.">‹</button>
      <select id="preset" aria-label="Preset" data-help="Presets: the factory list, four of your own, and saving what you have now into one of them."></select>
      <button type="button" class="key-btn nav" id="preset-next" aria-label="Next preset" data-help="Next preset.">›</button>
      <div class="seg ab" id="ab" role="radiogroup" aria-label="Compare two settings" data-help="A and B hold two settings of every knob. Switch to compare; edits go to whichever is lit.">
        <button type="button" role="radio" data-ab="A" aria-checked="true">A</button>
        <button type="button" role="radio" data-ab="B" aria-checked="false">B</button>
      </div>
      <button type="button" class="key-btn nav" id="undo" aria-label="Undo" data-help="Undo the last change.">↶</button>
      <button type="button" class="key-btn nav" id="redo" aria-label="Redo" data-help="Redo.">↷</button>
    </div>
    <div class="tools">
      <button type="button" class="key-btn" id="load" data-help="Load an audio file. It becomes the File source.">Load</button>
      <button type="button" class="key-btn toggle" id="thru" aria-pressed="false" data-help="Thru: keep the live input sounding while the loop plays, so you can play over it.">Thru</button>
      <button type="button" class="key-btn" id="save" data-help="Save a WAV of the loop or file: with the effect baked in as it is set now, or without it." aria-haspopup="menu" aria-expanded="false">Save WAV</button>
      <button type="button" class="key-btn" id="skin" data-help="Skin: three faces for the same effect. Unit, Cassette (a tape box with long faders) and Reel (a reel-to-reel deck). Tap to change.">Unit</button>
      <button type="button" class="key-btn" id="show" data-help="Display: the tape, full screen, moving to the sound. Tap the small round window for the visualizer. Tap anywhere else to come back.">Display</button>
    </div>
  </header>

  <!-- the screen, and beside it the effect: a chain of sections and the controls of the one in hand -->
  <section class="stage">
    <div class="side left" id="side-left" aria-label="Faders and scenes"></div>
    <div class="screen" id="screen" data-help="The window. Drag the loop's two ends to set where it loops; pull the dots under them inward to fade the loop in and out. Double-tap the dots to clear the fades.">
      <canvas id="deck" aria-label="The tape: reels, loop, sound and motion"></canvas>
      <p class="sr" id="status" aria-live="polite"></p>
    </div>
    <aside class="panel" aria-label="Effect">
      <div class="chain" id="chain" role="tablist" aria-label="Sections"></div>
      <div class="pages" id="pages"></div>
      <div class="recbar" id="recbar"></div>
    </aside>
    <div class="side right" id="side-right" aria-label="Faders and sections"></div>
  </section>

  <footer class="foot">
    <div class="pads" id="pads" aria-label="Hold pads"></div>
    <button type="button" class="key-btn toggle" id="latch" aria-pressed="false" data-help="Latch, three ways. Off: a pad works while you hold it. On: a tap switches it on, another tap switches it off. Smooth: the same, but the effect glides in and out.">Latch<small id="latch-state">off</small></button>
  </footer>

  <p class="helpline" id="help"></p>
  <input type="file" id="file" accept="audio/*" hidden>
</main>

<script src="dsp/tape-processor.js?v=44"></script>
<script src="app.js?v=44"></script>
<script src="skins.js?v=44"></script>
<script src="tech.js?v=44"></script>
<script src="viz.js?v=44"></script>
<script src="tempo.js?v=44"></script>
<script src="sample.js?v=44"></script>
<script src="dsp/vocal-dsp.js?v=44"></script>
<script src="vocal.js?v=44"></script>
<script>
  // on the hosted copy only: keep the app available offline (see sw.js)
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
